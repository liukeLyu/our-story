<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Blue Door</title>
    <style>
      :root {
        color-scheme: light;
        --paper: #fbfaf7;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100svh;
        display: grid;
        place-items: center;
        background: var(--paper);
      }

      main {
        width: min(100%, 720px);
        padding: 28px;
        display: grid;
        place-items: center;
      }

      img {
        display: block;
        width: min(86vw, 560px);
        height: auto;
      }
    </style>
  </head>
  <body>
    <main>
      <img src="generated/blue_gate_doodle_transparent.png" alt="" />
    </main>
  </body>
</html>
