<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Blue Door</title>
    <style>
      :root {
        color-scheme: light;
        --paper: #fbfaf7;
        --ink: #243033;
        --muted: #6d7f73;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100svh;
        display: grid;
        place-items: center;
        background: var(--paper);
        color: var(--ink);
        font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
      }

      main {
        width: min(100%, 720px);
        padding: 42px 28px;
        display: grid;
        place-items: center;
        gap: 28px;
        text-align: center;
      }

      img {
        display: block;
        width: min(86vw, 560px);
        height: auto;
      }

      .riddle {
        margin: 0;
        max-width: 18em;
        color: var(--muted);
        font-size: clamp(19px, 5vw, 28px);
        font-weight: 400;
        line-height: 1.85;
        letter-spacing: 0;
      }
    </style>
  </head>
  <body>
    <main>
      <img src="generated/blue_gate_doodle_transparent.png" alt="" />
      <p class="riddle">
        叶影落下的地方，蓝色会替你指路。
      </p>
    </main>
  </body>
</html>
